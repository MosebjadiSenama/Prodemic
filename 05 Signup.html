<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodemic</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="script.js"></script>

<!--GOOGLE FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>

<body>
<div class="app-container">


<div class="signup-page">
<section class="form2">

    <h1>CREATE ACCOUNT</h1>
    <p class="signup-text">Join Prodemic and start simplifying your academic life.</p>
<div class="fill-in">

<div class="signup-page">
    <div class="form-1">
    <label>NAME</label>
    <input placeholder="Enter your full name" type="Email"  id="name" >
    </div>


    <div class="form-1">
    <label>EMAIL</label>
    <input placeholder="Enter your email address" type="email"  id="email">
    </div>

    <div class="form-1">
    <label>PASSWORD</label>
    <input placeholder="Enter your password" type="password" id="enter-password">
    </div>

    <div class="form-1">
    <label>CONFIRM PASSWORD</label>
    <input placeholder="Confirm your password" type="password" id="confirm-password">
    </div>
<p id="error-message"></p>
<button class="create-account-btn2">Create Account</button>
</div>
</div>
</section>
</div>
</body>
</html>
