                <!-- Focus -->

</div>

<div class="app-layout">

        

        <main class="focus-main">

            <header class="focus-header">
                <div>
                    <h1>Focus Study Session</h1>
                    <p>
                        Make time for focused work, minimise distractions,
                        and take your studies one session at a time.
                    </p>
                </div>
            </header>

            <section class="timer-card" aria-labelledby="timerHeading">

                <h2 id="timerHeading">Focus Timer</h2>

                <div class="timer-circle" id="timerCircle">

                    <div class="timer-content">
                        <p id="timerDisplay" role="timer" aria-live="off">
                            25:00
                        </p>

                        <span id="timerStatus">Ready to focus</span>
                    </div>

                </div>

                <div class="timer-controls">

                    <button type="button"
                        id="startBtn"
                        class="primary-btn">
                        <i class="fa-solid fa-play"></i>
                        Start
                    </button>

                    <button type="button"
                        id="resetBtn"
                        class="secondary-btn">
                        <i class="fa-solid fa-rotate-right"></i>
                        Reset
                    </button>

                </div>

            </section>

            <section class="session-card" aria-labelledby="sessionHeading">

                <h2 id="sessionHeading">Choose your session length</h2>

                <div class="session-options">

                    <button type="button"
                        class="session-option active"
                        data-minutes="25"
                        aria-pressed="true">
                        25 min
                    </button>

                    <button type="button"
                        class="session-option"
                        data-minutes="50"
                        aria-pressed="false">
                        50 min
                    </button>

                    <button type="button"
                        class="session-option"
                        id="customBtn"
                        aria-pressed="false">
                        Custom
                    </button>

                </div>

                <div class="custom-duration" id="customDuration" hidden>

                    <label for="customMinutes">Duration in minutes</label>

                    <input type="number"
                        id="customMinutes"
                        min="1"
                        max="180"
                        value="30">

                    <button type="button" id="applyCustomBtn">
                        Set duration
                    </button>

                </div>

            </section>


        </main>

    </div>

</body>

</html>
