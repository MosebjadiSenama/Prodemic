<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tasks</title>


    <!--==================================================
         CSS
    ==================================================-->

    <link rel="stylesheet" href="css/home.css">

    <link rel="stylesheet" href="css/tasks.css">

    <link rel="stylesheet" href="css/overlay.css">


    <!--==================================================
         JavaScript
    ==================================================-->

    <script
        type="module"
        src="js/tasks.js"
    >
    </script>

     <script
        type="module"
        src="js/script.js"
        defer
    >
    </script>

    <!--==================================================
         Font Awesome Icons
    ==================================================-->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!--==================================================
         Fonts
    ==================================================-->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<div class="app-container">


    <!--==================================================
         PAGE
    ==================================================-->

    <div class="page">


        <!--==================================================
             HEADER
        ==================================================-->

        <header class="page-header">

            <div class="header-top">

                <div class="header-text">

                    <h1>
                        Tasks
                    </h1>

                    <p>
                        Stay on top of everything you need to do.
                    </p>

                </div>


                <a
                    href="21 addtask.html"
                    class="primary-btn"
                >

                    <i class="fa-solid fa-plus"></i>

                    Add Task

                </a>

            </div>

        </header>


        <!--==================================================
             FILTERS
        ==================================================-->

        <div class="task-filters">

            <button
                class="filter-btn active"
            >

                All

            </button>


            <button
                class="filter-btn"
            >

                Due soon

            </button>


            <button
                class="filter-btn"
            >

                Priority

            </button>


            <button
                class="filter-btn"
            >

                Completed

            </button>

        </div>


        <!--==================================================
             TASK LIST
        ==================================================-->

        <section
            id="taskList"
            class="task-list"
        >

            <!-- Tasks will appear here -->

        </section>


        <!--==================================================
             EMPTY STATE
        ==================================================-->

        <section
            id="emptyState"
            class="empty-state"
        >

            <img
                src="assets/images/no-tasks.png"
                alt="No Tasks"
                class="empty-image"
            >

            <h2>

                No Tasks Yet

            </h2>

            <p>

                Create your first task to stay organised throughout the semester.

            </p>

        </section>


    </div>


    <!--==================================================
         DESKTOP SIDEBAR
    ==================================================-->

    <aside
        class="sidebar collapsed"
        id="sidebar"
    >


        <!--==================================================
             SIDEBAR LOGO
        ==================================================-->

        <div class="sidebar-logo">

            <img
                src="assets/images/logo.png"
                alt="Logo"
                class="sidebar-logo-image"
            >

            <h1>

                Prodemic

            </h1>

        </div>


        <!--==================================================
             SIDEBAR NAVIGATION
        ==================================================-->

        <nav class="sidebar-navigation">


            <!-- Home -->

            <a
                href="07 home.html"
                class="sidebar-item"
                data-tooltip="Home"
            >

                <i class="fa-solid fa-house"></i>

                <span>

                    Home

                </span>

            </a>


            <!-- Tasks -->

            <a
                href="09 tasks.html"
                class="sidebar-item active"
                data-tooltip="Tasks"
            >

                <i class="fa-solid fa-list-check"></i>

                <span>

                    Tasks

                </span>

            </a>


            <!-- Add -->

            <button
                class="sidebar-add nav-add"
                type="button"
                data-tooltip="Add"
            >

                <i class="fa-solid fa-plus"></i>

                <span>

                    Add

                </span>

            </button>


            <!-- Schedule -->

            <a
                href="11 schedule.html"
                class="sidebar-item"
                data-tooltip="Schedule"
            >

                <i class="fa-solid fa-calendar"></i>

                <span>

                    Schedule

                </span>

            </a>


            <!-- Modules -->

            <a
                href="08 modules.html"
                class="sidebar-item"
                data-tooltip="Modules"
            >

                <i class="fa-solid fa-book"></i>

                <span>

                    Modules

                </span>

            </a>


        </nav>
<!--==================================================
                CREATE MENU
==================================================-->

<div
    class="create-overlay"
    id="createOverlay"
>


    <div class="create-sheet">


        <div class="sheet-handle"></div>


        <h2>
            Create New
        </h2>


        <!--==================================================
                    NEW TASK
        ==================================================-->

        <div
            class="create-option"
            id="newTask"
        >

            <div class="option-text">

                <h3>
                    New Task
                </h3>

                <p>
                    Add a task
                </p>

            </div>


            <span>

                <i class="fa-solid fa-chevron-right"></i>

            </span>

        </div>



        <!--==================================================
                    ADD EVENT
        ==================================================-->

        <div
            class="create-option"
            id="newLecture"
        >

            <div class="option-text">

                <h3>
                    Add Event
                </h3>

                <p>
                    Add a lecture, assessment or academic event
                </p>

            </div>


            <span>

                <i class="fa-solid fa-chevron-right"></i>

            </span>

        </div>



        <!--==================================================
                    CLOSE
        ==================================================-->

        <button
            type="button"
            id="closeSheet"
            class="cancel-btn"
        >

            Cancel

        </button>


    </div>


</div>

        <!--==================================================
             SIDEBAR BOTTOM
        ==================================================-->

        <div class="sidebar-bottom">


            <!-- Profile -->

            <button
                class="sidebar-item"
                id="profileBtn"
                type="button"
                data-tooltip="Profile"
            >

                <i class="fa-solid fa-circle-user"></i>

                <span>

                    Profile

                </span>

            </button>


        </div>


        <!--==================================================
             SIDEBAR TOGGLE
        ==================================================-->

        <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Open navbar"
        >

            <i class="fa-solid fa-angles-right"></i>

        </button>


    </aside>


    <!--==================================================
         PROFILE MENU
    ==================================================-->

    <div
        class="profile-menu"
        id="profileMenu"
    >


        <div class="profile-menu-header">

            <div class="profile-menu-icon">

                <i class="fa-solid fa-circle-user"></i>

            </div>


            <div class="profile-menu-user">

                <strong id="profileName">

                    Profile

                </strong>

            </div>

        </div>


        <button
            class="profile-option logout-btn"
            id="logoutBtn"
            type="button"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>

                Logout

            </span>

        </button>


    </div>


</div>


</body>

</html>
