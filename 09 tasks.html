<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasks</title>

 <link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/tasks.css">
<link rel="stylesheet" href="css/overlay.css">

<script type="module" src="js/tasks.js"></script>
<script type="module" src="js/script.js"></script>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app-container">

<div class="page">

<!--==================================================
HEADER
===================================================-->

<header class="page-header">

<h1>Tasks</h1>

<p>

Stay on top of everything you need to do.

</p>

</header>

<!--==================================================
FILTERS
===================================================-->

<div class="task-filters">

<button class="filter-btn active">

All

</button>

<button class="filter-btn">

Due soon

</button>

<button class="filter-btn">

Priority

</button>

<button class="filter-btn">

Completed

</button>

</div>

<!--==================================================
TASK LIST
===================================================-->

<section id="taskList" class="task-list">

<!-- Tasks will appear here -->

</section>

<!--==================================================
EMPTY STATE
===================================================-->

<section id="emptyState" class="empty-state">

<img

src="assets/images/no-tasks.png"

alt="No Tasks"

class="empty-image"

>

<h2>

No Tasks Yet

</h2>

<p>

Create your first task to stay organised throughout the semester.

</p>

</section>

<!--==================================================
BOTTOM BUTTONS
===================================================-->

<div class="task-actions">

<a

href="21 addTask.html"

class="primary-btn"

>

<i class="fa-solid fa-plus"></i>

Add Task

</a>

<a

href="#"

class="secondary-btn"

>

<i class="fa-solid fa-wand-magic-sparkles"></i>

Generate AI Tasks

</a>

</div>

</div>



<<!-- ==================================================
     DESKTOP SIDEBAR
================================================== -->

<aside class="sidebar collapsed" id="sidebar">

    <!-- ==================================================
         Sidebar Logo
    ================================================== -->

    <div class="sidebar-logo">

        <!-- Logo shown when sidebar is CLOSED -->

        <img
            src="assets/images/logo.png"
            alt="Logo"
            class="sidebar-logo-image">

        <!-- Text shown when sidebar is OPEN -->

        <h1>Prodemic</h1>

    </div>


    <!-- ==================================================
         Sidebar Navigation
    ================================================== -->

    <nav class="sidebar-navigation">

        <!-- Home -->

        <a
            href="07 home.html"
            class="sidebar-item "
            data-tooltip="Home">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>


        <!-- Tasks -->

        <a
            href="09 tasks.html"
            class="sidebar-item active"
            data-tooltip="Tasks">

            <i class="fa-solid fa-list-check"></i>

            <span>Tasks</span>

        </a>


        <!-- Add Button -->

        <button
            class="sidebar-add nav-add"
            type="button"
            data-tooltip="Add">

            <i class="fa-solid fa-plus"></i>

            <span>Add</span>

        </button>


        <!-- Schedule -->

        <a
            href="11 schedule.html"
            class="sidebar-item"
            data-tooltip="Schedule">

            <i class="fa-solid fa-calendar"></i>

            <span>Schedule</span>

        </a>


        <!-- Modules -->

        <a
            href="08 modules.html"
            class="sidebar-item"
            data-tooltip="Modules">

            <i class="fa-solid fa-book"></i>

            <span>Modules</span>

        </a>

    </nav>


    <!-- ==================================================
         Sidebar Bottom
    ================================================== -->

    <div class="sidebar-bottom">

        <!-- Settings -->

        <a
            href="#"
            class="sidebar-item"
            data-tooltip="Settings">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </a>


        <!-- Profile -->

        <a
            href="#"
            class="sidebar-item"
            data-tooltip="Profile">

            <i class="fa-solid fa-circle-user"></i>

            <span>Profile</span>

        </a>


        <!-- Logout -->

        <button
            class="sidebar-item sidebar-logout"
            id="logoutBtn"
            type="button"
            data-tooltip="Logout">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </button>

    </div>


    <!-- ==================================================
         Sidebar Open / Close Button
    ================================================== -->

    <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="Open navbar">

        <i class="fa-solid fa-angles-right"></i>

    </button>

</aside>
</div>


</body>

</html>
