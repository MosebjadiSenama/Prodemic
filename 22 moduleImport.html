<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import Module</title>
    <link rel="stylesheet" href="css/moduleoutline.css">
   

    <script type="module" src="js/ai.js"></script>


</head>

<body>
 

    <a href="07 home.html">
        Back
    </a>
    <h1>Import Module</h1>

    <p>
        Upload your module outline and Prodemic will extract
        the important academic information.
    </p>


    <!-- PDF upload -->

    <input
        type="file"
        id="pdf-upload"
        accept="application/pdf"
    >


    <!-- File preview -->

    <div id="file-preview" style="display: none;">

        <p id="file-name"></p>

        <p id="file-size"></p>

        <button
            type="button"
            id="remove-file"
        >
            Remove
        </button>

    </div>


    <!-- Continue button -->
<button id="continue-btn" disabled>

    <!-- Normal button text -->
    <span id="continue-text">Continue</span>

    <!-- Loading spinner -->
    <span id="loading-spinner" class="loading-spinner"></span>

</button>


    
</body>

</html>
