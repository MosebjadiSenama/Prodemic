<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import Module</title>
    <link rel="stylesheet" href="css/moduleoutline.css">
    

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
   

    <script type="module" src="js/ai.js"></script>


</head>

<body>
 

    <a href="07 home.html">
        Back
    </a>
    <h1>Import Module</h1>

    <p>
        Upload your module outline and Prodemic will extract
        the important academic information.
    </p>


    <!-- PDF upload -->

    <input
        type="file"
        id="pdf-upload"
        accept="application/pdf"
    >


    <!-- File preview -->

    <div id="file-preview" style="display: none;">

        <p id="file-name"></p>

        <p id="file-size"></p>

        <button
            type="button"
            id="remove-file"
        >
            Remove
        </button>

    </div>


    <!-- Continue button -->
<button id="continue-btn" disabled>

    <!-- Normal button text -->
    <span id="continue-text">Continue</span>

    <!-- Loading spinner -->
    <span id="loading-spinner" class="loading-spinner"></span>

</button>
<!-- ================================= -->
<!-- MODULE PROCESSING SCREEN -->
<!-- ================================= -->


<div class="processing-page" id="processingPage" style="display: none;">

    <div class="processing-card">

        <img src="assets/images/PDF.png" alt="PDF document">

        <h2>Analysing Your Module</h2>

        <p id="processingText">
            AI is extracting and organising your module information.
            This may take a moment...
        </p>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

    </div>

</div>
    
</body>

</html>
