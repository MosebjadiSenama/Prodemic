<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Import Module Outline</title>

<link rel="stylesheet" href="css/moduleoutline.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script type="module"
src="js/moduleoutline.js"
defer></script>

<script type="module"
src="js/moduleParser.js"
defer></script>


</head>

<body>

<main class="page">

    <header class="page-header">
        <a href="07 home.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

        <h1>Import Module Outline</h1>

        <p>

            Paste your module outline below to automatically
            generate your planner.

        </p>

    </header>

    <!-- STEP 1 -->

    <section
    id="stepOne"
    class="card">

        <h2>

            Module Outline

        </h2>

        <textarea

            id="outlineInput"

            placeholder="Paste the complete module outline here..."

        ></textarea>

        <button

            id="analyseBtn"

            class="primary"

        >

            Analyse Outline

        </button>

    </section>

    <!-- STEP 2 -->

    <section

        id="stepTwo"

        class="card hidden"

    >

        <h2>

            Review

        </h2>

        <div class="summary">

            <div>

                <label>

                    Module

                </label>

                <span id="moduleName"></span>

            </div>

            <div>

                <label>

                    Code

                </label>

                <span id="moduleCode"></span>

            </div>

            <div>

                <label>

                    Semester

                </label>

                <span id="semester"></span>

            </div>

            <div>

                <label>

                    Weeks

                </label>

                <span id="weekCount"></span>

            </div>

            <div>

                <label>

                    Topics

                </label>

                <span id="topicCount"></span>

            </div>

            <div>

                <label>

                    Assessments

                </label>

                <span id="assessmentCount"></span>

            </div>

        </div>

        <h3>

            Weekly Topics

        </h3>

        <div id="topicsContainer"></div>

        <h3>

            Assessments

        </h3>

        <div id="assessmentContainer"></div>

        <div class="buttons">

            <button

                id="backBtn"

                class="secondary"

            >

                Back

            </button>

            <button

                id="generateBtn"

                class="primary"

            >

                Generate Planner

            </button>

        </div>

    </section>

</main>

</body>

</html>
