
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Paste Module Outline</title>

   <link rel="stylesheet" href="css/pasteModule.css">
   <script type="module" src="js/pasteModule.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>
    <div class="app-container">

<div class="page">

    <header class="top-bar">

        <button id="backBtn" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h2>Paste Module Outline</h2>

    </header>

    <section class="card">

        <h3>Module Outline</h3>

        <p>

            Paste your complete university module outline below.

        </p>

        <textarea

            id="moduleText"

            placeholder="Paste your module outline here..."

            rows="18"

        ></textarea>

        <div class="character-row">

            <span id="characterCount">

                0 Characters

            </span>

        </div>

        <button

            id="analyseBtn"

            class="primary-btn"

        >

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            Analyse with AI

        </button>

    </section>

</div>


    </div>

</body>

</html>
