<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


     <link rel="stylesheet" href="css/module.css">
      <link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/manual.css">
<script type="module" src="js/manualtimetable.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <body>

<div class="app-container">

<button
class="back-btn"
id="backBtn">

    <a href="08 timetable.html">

        <i class="fa-solid fa-arrow-left"></i>

    </a>

</button>

<h2>

Enter your timetable details

</h2>

<div class="page-heading">

<h1>

Add Lecture

</h1>

<p>

Enter your lecture details below.

</p>

</div>

<input
type="text"
id="module"
placeholder="Module Name">

<select id="day">

<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>

</select>

<input
type="time"
id="startTime">

<input
type="time"
id="endTime">

<input
type="text"
id="venue"
placeholder="Venue">

<button
class="continue-btn"
id="addLecture">

+ Add Lecture

</button>

<div id="lectureList"></div>

<button
class="continue-btn"
id="saveTimetable">

Save Timetable

</button>

</div>  
</body>
</html>
