
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodemic | Sign In</title>

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    

    <!-- stylesheets -->
   
    <link rel="stylesheet" href="css/onboarding.css">
   

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- javascript -->
    <script type="module" src="js/script.js"></script>
</head>

<body class="auth-page">

<div class="app-container">

<main class="signup-page auth-layout">

        <!-- LEFT BRANDING PANEL -->
        <aside class="auth-branding">

            <div class="auth-brand-content">

                <img src="assets/images/logo.png"
                     class="auth-logo"
                     alt="Prodemic logo">

                <h2>Prodemic</h2>

                <p>
                    Designed to help you think less and do more</p>

                <span class="brand-accent"></span>

            </div>

        </aside>

<!--RIGHT SIDE FORM-->


        <!-- sign in form -->
        <section class="forgot-passoword-page" id="signinSection">
            

            <div class="form">
                <!-- back button -->
        <a href="02%20onboarding.html" class="auth-back-button">
            &larr; Back
        </a>

                <h1>Sign In</h1>

                <p class="form-description">
                    Log in by entering your email address and password.
                </p>

                <div class="fill-in">

                    <!-- email -->
                    <div class="form-1">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            autocomplete="email">

                             <p id="email-error" class="error-message"></p>
                    </div>

                    <!-- password -->
                    <div class="form-1">
                        <label for="enter-password">Password</label>
                        <div class="password-input-wrapper">
       <input
        type="password"
        id="enter-password"
        placeholder="Enter your password"
        autocomplete="current-password"
        class="password-input"
    >

    <button
        type="button"
        class="toggle-password"
        aria-label="Show password"
        aria-pressed="false"
    >
        <i class="fa-regular fa-eye"></i>
    </button>
</div>

                        <a href="06 forgotpassword.html" class="forgot-password">
                            Forgot Password?
                        </a>
                         <p id="signin-error" style="color: #d93025; font-size: 13px; margin-top: 6px;"></p>
                    </div>

                    <!-- sign in button -->
                    <div class="form-1">
                        <button type="button" class="signin-btn">
                            Sign In
                        </button>
                    </div>

                    <!-- divider -->
                    <div class="line-div">
                        <div class="line"></div>
                        <p>or</p>
                        <div class="line"></div>
                    </div>

                    <!-- create account -->
                    <a href="05 Signup.html" class="create-account-btn2">
                        Create Account
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
