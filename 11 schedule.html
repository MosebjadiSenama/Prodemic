<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule | Prodemic</title>


    <!--==================================================
                    STYLES
    ==================================================-->

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/overlay.css">
    
    <link rel="stylesheet" href="css/home.css">


    <!--==================================================
                    FONT AWESOME
    ==================================================-->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!--==================================================
                    GOOGLE FONT
    ==================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!--==================================================
                    SCHEDULE JAVASCRIPT
    ==================================================-->

    <script
        type="module"
        src="js/schedule.js"
        defer>
    </script>

     <script
        type="module"
        src="js/script.js"
        defer
    >
    </script>

     <script
        type="module"
        src="js/overlay.js"
        defer
    >
    </script>


</head>


<body>



<!--==================================================
                SIDEBAR
==================================================-->

<aside
    class="sidebar collapsed"
    id="sidebar"
>


    <!--==================================================
                    SIDEBAR LOGO
    ==================================================-->

    <div class="sidebar-logo">

        <img
            src="assets/images/logo.png"
            alt="Prodemic Logo"
            class="sidebar-logo-image"
        >

        <h1>
            Prodemic
        </h1>

    </div>


    <!--==================================================
                SIDEBAR NAVIGATION
    ==================================================-->

    <nav class="sidebar-navigation">


        <a
            href="07 home.html"
            class="sidebar-item"
            data-tooltip="Home"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>


        <a
            href="09 tasks.html"
            class="sidebar-item"
            data-tooltip="Tasks"
        >

            <i class="fa-solid fa-list-check"></i>

            <span>
                Tasks
            </span>

        </a>


             <!-- Focus -->
    <a href="25 focus.html"
       class="sidebar-item"
       data-tooltip="Focus">
        <i class="fa-solid fa-stopwatch"></i>
        <span>Focus</span>
    </a>


        <a
            href="11 schedule.html"
            class="sidebar-item active"
            data-tooltip="Schedule"
        >

            <i class="fa-solid fa-calendar"></i>

            <span>
                Schedule
            </span>

        </a>


        <a
            href="08 modules.html"
            class="sidebar-item"
            data-tooltip="Modules"
        >

            <i class="fa-solid fa-book"></i>

            <span>
                Modules
            </span>

        </a>


    </nav>


    <!--==================================================
                SIDEBAR BOTTOM
    ==================================================-->

    <div class="sidebar-bottom">


        <!-- Profile -->

        <button
            class="sidebar-item"
            id="profileBtn"
            type="button"
            data-tooltip="Profile"
        >

            <i class="fa-solid fa-circle-user"></i>

            <span>
                Profile
            </span>

        </button>


    </div>


    <!--==================================================
                SIDEBAR TOGGLE
    ==================================================-->

    <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="Open navbar"
        title="Open navbar"
    >

        <i class="fa-solid fa-angles-right"></i>

    </button>


</aside>


    <!--==================================================
         PROFILE MENU
    ==================================================-->

    <div
        class="profile-menu"
        id="profileMenu"
    >


        <div class="profile-menu-header">

            <div class="profile-menu-icon">

                <i class="fa-solid fa-circle-user"></i>

            </div>


            <div class="profile-menu-user">

                <strong id="profileName">

                    Profile

                </strong>

            </div>

        </div>


        <button
            class="profile-option logout-btn"
            id="logoutBtn"
            type="button"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>

                Logout

            </span>

        </button>

         <!--support and suggestions-->


        
        <a  href="26 support.html"
            class="support"
            id="supportbtn"
            type="button"
        >

          <i class="fa-solid fa-comment-dots"></i>
           

           <span>

                Support & suggestions

            </span>

        </a>


    </div>


</div>
     <!--==================================================
                        MAIN CONTENT
        ==================================================-->

        <main class="home-content">


            <!--==================================================
                        SCHEDULE PAGE
            ==================================================-->

            <section id="schedulePage">


                <!--==================================================
                            HEADER
                ==================================================-->

                <header class="schedule-header">


                    <div class="schedule-heading">

                        <h1>
                            Schedule
                        </h1>

                        <p>
                            Plan your time, ace your day.
                        </p>

                    </div>


<!--==================================================
                        CALENDAR CONTROLS
==================================================-->
<div class="calendar-view-switcher">

    <button
        type="button"
        class="view-option"
        data-view="day"
    >
        Day
    </button>

    <button
        type="button"
        class="view-option active"
        data-view="week"
    >
        Week
    </button>

    <button
        type="button"
        class="view-option"
        data-view="month"
    >
        Month
    </button>

</div>

<!-- Keep this hidden select for the existing JavaScript -->
<select id="calendarView" hidden>
    <option value="day">Day</option>
    <option value="week" selected>Week</option>
    <option value="month">Month</option>
</select>


                </header>


 <!--==================================================
                        CALENDAR HEADER
 ==================================================-->

        

<div class="calendar-header">

    <div class="calendar-header-content">

        <h2 id="calendarTitle">This Week</h2>

        <p id="calendarSubtitle">
            Organise your schedule for the week.
        </p>

    </div>

    <a
        href="21 addevent.html"
        class="add-event-btn"
        id="addLectureBtn"
        aria-label="Add event"
        title="Add event"
    >
        <i class="fa-solid fa-plus"></i>
        <span>Add event</span>
    </a>

</div>


<!-- =========================================
     CALENDAR DATE NAVIGATION
========================================= -->

<div class="calendar-navigation">

    <button
        type="button"
        id="prevBtn"
        class="calendar-nav-btn"
        aria-label="Previous"
    >
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="calendar-nav-date">

        <h3 id="calendarNavLabel">
            This Week
        </h3>

        <span id="calendarWeekNumber"></span>

    </div>

    <button
        type="button"
        id="nextBtn"
        class="calendar-nav-btn"
        aria-label="Next"
    >
        <i class="fa-solid fa-chevron-right"></i>
    </button>

</div>



<!--==================================================
                    CALENDAR
==================================================-->

<div id="calendar"></div>


                <!--==================================================
                        SCHEDULE LIST
                ==================================================-->

           <div id="scheduleList"></div>

</section>


        </main>


</body>

</html>
