<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule | Prodemic</title>

    <!-- Main CSS -->
     <link rel="stylesheet" href="css/home.css">
      <link rel="stylesheet" href="css/module.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/overlay.css">

    <!-- Schedule JS -->
    <script type="module" src="js/schedule.js"></script>
   

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

</head>

<body>

<div class="app-container">

<!--==================================================
SCHEDULE PAGE
===================================================-->

<section id="schedulePage">

    <!--==============================
    HEADER
    ===============================-->

    <header class="schedule-header">

        <div>

            <h1>Schedule</h1>

            <p>

                Plan your time, ace your day.

            </p>

        </div>

        <div class="calendar-controls">

            <button id="prevBtn">

                <i class="fa-solid fa-chevron-left"></i>

            </button>

            <select id="calendarView">

                <option value="day">

                    Day

                </option>

                <option value="week" selected>

                    Week

                </option>

                <option value="month">

                    Month

                </option>

            </select>

            <button id="nextBtn">

                <i class="fa-solid fa-chevron-right"></i>

            </button>

        </div>

    </header>



<!--==================================================
CALENDAR HEADER
===================================================-->

<div class="calendar-header">

    <div>

        <h2 id="calendarTitle">

            This Week

        </h2>

        <p id="calendarSubtitle">

            Organise your lectures for the week.

        </p>

    </div>

    <button
        class="add-lecture-btn"
        onclick="window.location.href='21 addevent.html'">

        <i class="fa-solid fa-plus"></i>

    </button>

</div>



<!--==================================================
CALENDAR
===================================================-->

<div id="calendar">

    <!-- Generated by schedule.js -->

</div>



<!--==================================================
SCHEDULE LIST
===================================================-->

<div id="scheduleList">

    <!-- Week / Day / Month generated here -->

</div>



<!--==================================================
BOTTOM ACTIONS
===================================================-->

<div class="schedule-actions">

    <button
        class="primary-btn"
        onclick="window.location.href='21 addevent.html'">

        <i class="fa-solid fa-plus"></i>

        Add event

    </button>

   

</div>

<!--==================================================
CREATE MENU
===================================================-->

<div class="create-overlay" id="createOverlay">

    <div class="create-sheet">

        <div class="sheet-handle"></div>

        <h2>Create New</h2>

        <!-- Module -->

        <div class="create-option" id="newModule">

            <div class="option-icon blue">

                <i class="fa-solid fa-book"></i>

            </div>

            <div class="option-text">

                <h3>New Module</h3>

                <p>Add a new subject</p>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- Task -->

        <div class="create-option" id="newTask">

            <div class="option-icon green">

                <i class="fa-solid fa-list-check"></i>

            </div>

            <div class="option-text">

                <h3>New Task</h3>

                <p>Add a task</p>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- Lecture -->

        <div class="create-option"
             onclick="window.location.href='21 addevent.html'">

            <div class="option-icon purple">

                <i class="fa-solid fa-calendar-days"></i>

            </div>

            <div class="option-text">

                <h3>New Lecture</h3>

                <p>Add a lecture to your schedule</p>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <!-- Assessment -->

        <div class="create-option">

            <div class="option-icon orange">

                <i class="fa-solid fa-file-pen"></i>

            </div>

            <div class="option-text">

                <h3>New Assessment</h3>

                <p>Add an upcoming assessment</p>

            </div>

            <i class="fa-solid fa-chevron-right"></i>

        </div>

        <button
            id="closeSheet"
            class="cancel-btn">

            Cancel

        </button>

    </div>

</div>



<!-- ==================================================
     DESKTOP SIDEBAR
================================================== -->

<aside class="sidebar collapsed" id="sidebar">

    <!-- ==================================================
         Sidebar Logo
    ================================================== -->

    <div class="sidebar-logo">

        <!-- Logo shown when sidebar is CLOSED -->

        <img
            src="assets/images/logo.png"
            alt="Logo"
            class="sidebar-logo-image">

        <!-- Text shown when sidebar is OPEN -->

        <h1>Prodemic</h1>

    </div>


    <!-- ==================================================
         Sidebar Navigation
    ================================================== -->

    <nav class="sidebar-navigation">

        <!-- Home -->

        <a
            href="07 home.html"
            class="sidebar-item"
            data-tooltip="Home">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </a>


        <!-- Tasks -->

        <a
            href="09 tasks.html"
            class="sidebar-item"
            data-tooltip="Tasks">

            <i class="fa-solid fa-list-check"></i>

            <span>Tasks</span>

        </a>


        <!-- Add Button -->

        <button
            class="sidebar-add nav-add"
            type="button"
            data-tooltip="Add">

            <i class="fa-solid fa-plus"></i>

            <span>Add</span>

        </button>


        <!-- Schedule -->

        <a
            href="11 schedule.html"
            class="sidebar-item active"
            data-tooltip="Schedule">

            <i class="fa-solid fa-calendar"></i>

            <span>Schedule</span>

        </a>


        <!-- Modules -->

        <a
            href="08 modules.html"
            class="sidebar-item"
            data-tooltip="Modules">

            <i class="fa-solid fa-book"></i>

            <span>Modules</span>

        </a>

    </nav>


    <!-- ==================================================
         Sidebar Bottom
    ================================================== -->

    <div class="sidebar-bottom">

        <!-- Settings -->

        <a
            href="#"
            class="sidebar-item"
            data-tooltip="Settings">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </a>


        <!-- Profile -->

        <a
            href="#"
            class="sidebar-item"
            data-tooltip="Profile">

            <i class="fa-solid fa-circle-user"></i>

            <span>Profile</span>

        </a>


        <!-- Logout -->

        <button
            class="sidebar-item sidebar-logout"
            id="logoutBtn"
            type="button"
            data-tooltip="Logout">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </button>

    </div>


    <!-- ==================================================
         Sidebar Open / Close Button
    ================================================== -->

    <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="Open navbar">

        <i class="fa-solid fa-angles-right"></i>

    </button>

</aside>
</section>

</div>

</body>

</html>
