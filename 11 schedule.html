    <link
        rel="preconnect"

        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!--==================================================
                    SCHEDULE JAVASCRIPT
    ==================================================-->

    <script
        type="module"
        src="js/schedule.js"
        defer>
    </script>

</head>


<body>


   


        <!--==================================================

<!--==================================================
                SIDEBAR
==================================================-->

<aside
    class="sidebar collapsed"
    id="sidebar"
>


    <!--==================================================
                    SIDEBAR LOGO
    ==================================================-->

    <div class="sidebar-logo">

        <img
            src="assets/images/logo.png"
            alt="Prodemic Logo"
            class="sidebar-logo-image"
        >

        <h1>
            Prodemic
        </h1>

    </div>


    <!--==================================================
                SIDEBAR NAVIGATION
    ==================================================-->

    <nav class="sidebar-navigation">


        <a
            href="07 home.html"
            class="sidebar-item"
            data-tooltip="Home"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>


        <a
            href="09 tasks.html"
            class="sidebar-item"
            data-tooltip="Tasks"
        >

            <i class="fa-solid fa-list-check"></i>

            <span>
                Tasks
            </span>

        </a>


        <button
            class="sidebar-add nav-add"
            type="button"
            data-tooltip="Add"
        >

            <i class="fa-solid fa-plus"></i>

            <span>
                Add
            </span>

        </button>


        <a
            href="11 schedule.html"
            class="sidebar-item active"
            data-tooltip="Schedule"
        >

            <i class="fa-solid fa-calendar"></i>

            <span>
                Schedule
            </span>

        </a>


        <a
            href="08 modules.html"
            class="sidebar-item"
            data-tooltip="Modules"
        >

            <i class="fa-solid fa-book"></i>

            <span>
                Modules
            </span>

        </a>


    </nav>


    <!--==================================================
                SIDEBAR BOTTOM
    ==================================================-->

    <div class="sidebar-bottom">


        <!-- Profile -->

        <button
            class="sidebar-item"
            id="profileBtn"
            type="button"
            data-tooltip="Profile"
        >

            <i class="fa-solid fa-circle-user"></i>

            <span>
                Profile
            </span>

        </button>


    </div>


    <!--==================================================
                SIDEBAR TOGGLE
    ==================================================-->

    <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="Open navbar"
        title="Open navbar"
    >

        <i class="fa-solid fa-angles-right"></i>

    </button>


</aside>

            <!--==================================================
                        SIDEBAR TOGGLE
            ==================================================-->

            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                type="button"
                aria-label="Open navbar"
                title="Open navbar"
            >

                <i class="fa-solid fa-angles-right"></i>

            </button>


        </aside>



        <!--==================================================
                        MAIN CONTENT
        ==================================================-->

        <main class="home-content">


            <!--==================================================
                        SCHEDULE PAGE
            ==================================================-->

            <section id="schedulePage">


                <!--==================================================
                            HEADER
                ==================================================-->

                <header class="schedule-header">


                    <div class="schedule-heading">

                        <h1>
                            Schedule
                        </h1>

                        <p>
                            Plan your time, ace your day.
                        </p>

                    </div>


                    <!--==================================================
                        CALENDAR CONTROLS
                    ==================================================-->

                    <div class="calendar-controls">


                        <button
                            type="button"
                            id="prevBtn"
                            aria-label="Previous"
                        >

                            <i class="fa-solid fa-chevron-left"></i>

                        </button>


                        <select
                            id="calendarView"
                            aria-label="Calendar view"
                        >

                            <option value="day">
                                Day
                            </option>

                            <option
                                value="week"
                                selected
                            >
                                Week
                            </option>

                            <option value="month">
                                Month
                            </option>

                        </select>


                        <button
                            type="button"
                            id="nextBtn"
                            aria-label="Next"
                        >

                            <i class="fa-solid fa-chevron-right"></i>

                        </button>


                    </div>


                </header>



                <!--==================================================
                        CALENDAR HEADER
                ==================================================-->

                <div class="calendar-header">


                    <div class="calendar-header-content">

                        <h2 id="calendarTitle">
                            This Week
                        </h2>

                        <p id="calendarSubtitle">
                            Organise your schedule for the week.
                        </p>

                    </div>


                    <!--==================================================
                            ADD EVENT
                    ==================================================-->

                    <a
                        href="21 addevent.html"
                        class="add-event-btn"
                        id="addLectureBtn"
                        aria-label="Add event"
                        title="Add event"
                    >

                        <span>
                            Add event
                        </span>

                        <i class="fa-solid fa-plus"></i>

                    </a>


                </div>



                <!--==================================================
                            CALENDAR
                ==================================================-->

                <div id="calendar"></div>


                <!--==================================================
                        SCHEDULE LIST
                ==================================================-->

                <div id="scheduleList"></div>


<!--==================================================
                CREATE MENU
==================================================-->

<div
    class="create-overlay"
    id="createOverlay"
>


    <div class="create-sheet">


        <div class="sheet-handle"></div>


        <h2>
            Create New
        </h2>


        <!--==================================================
                    NEW TASK
        ==================================================-->

        <div
            class="create-option"
            id="newTask"
        >

            <div class="option-text">

                <h3>
                    New Task
                </h3>

                <p>
                    Add a task
                </p>

            </div>


            <span>

                <i class="fa-solid fa-chevron-right"></i>

            </span>

        </div>



        <!--==================================================
                    ADD EVENT
        ==================================================-->

        <div
            class="create-option"
            id="newLecture"
        >

            <div class="option-text">

                <h3>
                    Add Event
                </h3>

                <p>
                    Add a lecture, assessment or academic event
                </p>

            </div>


            <span>

                <i class="fa-solid fa-chevron-right"></i>

            </span>

        </div>



        <!--==================================================
                    CLOSE
        ==================================================-->

        <button
            type="button"
            id="closeSheet"
            class="cancel-btn"
        >

            Cancel

        </button>


    </div>


</div>


                </div>


            </section>


        </main>


</body>
