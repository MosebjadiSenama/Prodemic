<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prodemic | AI Processing</title>

    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/modulesProcessing.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="processing-page">

    <div class="processing-card">

        <div class="processing-icon">

            <i class="fa-solid fa-brain"></i>

        </div>

        <h2>Analysing Module Outline</h2>

        <p id="processingText">

            Preparing AIF...

        </p>

        <div class="progress-bar">

            <div id="progressFill"></div>

        </div>

        <div id="progressPercent">

            0%

        </div>

        <div class="steps">

            <div class="step" id="step1">

                <i class="fa-solid fa-file-lines"></i>

                Reading Module Outline

            </div>

            <div class="step" id="step2">

                <i class="fa-solid fa-book"></i>

                Identifying Module

            </div>

            <div class="step" id="step3">

                <i class="fa-solid fa-user"></i>

                Extracting Lecturer

            </div>

            <div class="step" id="step4">

                <i class="fa-solid fa-calendar-days"></i>

                Finding Lectures

            </div>

            <div class="step" id="step5">

                <i class="fa-solid fa-list-check"></i>

                Finding Assessments

            </div>

            <div class="step" id="step6">

                <i class="fa-solid fa-wand-magic-sparkles"></i>

                Generating Summary

            </div>

            <div class="step" id="step7">

                <i class="fa-solid fa-circle-check"></i>

                Finishing

            </div>

        </div>

    </div>

</div>

<script type="module" src="js/modulesProcessing.js"></script>

</body>

</html>
