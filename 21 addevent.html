<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Event</title>


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="css/addevent.css">


    <!-- HOME CSS -->

    <link
        rel="stylesheet"
        href="css/home.css">


    <!-- SCHEDULE CSS -->

    <link
        rel="stylesheet"
        href="css/schedule.css">



    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ADD EVENT JAVASCRIPT -->

    <script
        type="module"
        src="js/addevent.js" defer>
    </script>

</head>


<body>

<div class="app-container">


    <!-- ==================================================
         TOP BAR
         ================================================== -->

    <header class="top-bar">

        <a href="11 schedule.html"
            id="backToSchedule"
            class="back-btn"
            type="button">

            <i class="fa-solid fa-arrow-left"></i>

    </a>


        <div class="page-heading">

            <h2>Add Event</h2>

            <p>
                Add something to your schedule.
            </p>

        </div>

    </header>



    <!-- ==================================================
         FORM CARD
         ================================================== -->

    <main class="form-card">


        <!-- ==================================================
             EVENT TYPE
             ================================================== -->

        <div class="form-group">

            <label for="eventType">
                Type
            </label>

            <select
                id="eventType"
                required>

                <option value="">
                    Select event type
                </option>


                <option value="class">
                    Class
                </option>

                <option value="assessment">
                    Assessment
                </option>

                <option value="academic_event">
                    Academic Event
                </option>

                <option value="study_session">
                    Study Session
                </option>


                    <option value="other">Other</option>

                     </select>
                
<!--Other event type-->

<input 

      id="otherEventType"
      placeholder="Enter event type"
      style="display: none;"
      type="text"

>

    
           

        </div>



        <!-- ==================================================
             EVENT TITLE
             ================================================== -->

        <div class="form-group">

            <label for="eventTitle">
                Event Title
            </label>

            <input
                type="text"
                id="eventTitle"
                placeholder="e.g. Interactive Media Lecture"
                required>

        </div>



    <!-- ==================================================
     MODULE (OPTIONAL)
================================================== -->

<div class="form-group" id="moduleGroup">

    <label for="eventModule">
        Module <span class="optional-label">(Optional)</span>
    </label>

    <select id="eventModule">

        <option value="">
            No module selected
        </option>

    </select>

    <small class="form-hint">
        Link this event to a module, or leave it blank for a general event.
    </small>

</div>




<!-- ==================================================
     DATE
================================================== -->
<!-- DATE -->
<div class="form-group" id="singleDateGroup">
    <label for="eventDate">Date</label>
    <input type="date" id="eventDate">
</div>

<!-- DATE RANGE - ACADEMIC EVENTS ONLY -->
<div class="date-row" id="dateRangeGroup" style="display: none;">

    <div class="form-group">
        <label for="eventStartDate">From</label>
        <input type="date" id="eventStartDate">
    </div>

    <div class="form-group">
        <label for="eventEndDate">To</label>
        <input type="date" id="eventEndDate">
    </div>

</div>

<!-- ==================================================
     REPEAT CLASS
================================================== -->

<div class="form-group" id="repeatGroup" style="display: none;">

    <label for="repeatType">
        Repeat
    </label>

    <select id="repeatType">

        <option value="none">
            Does not repeat
        </option>

        <option value="daily">
            Every day
        </option>

        <option value="weekly">
            Every week
        </option>

        <option value="biweekly">
            Every 2 weeks
        </option>

        <option value="custom">
            Custom
        </option>

    </select>

</div>


<!-- ==================================================
     CUSTOM REPEAT
================================================== -->

<div class="form-group" id="customRepeatGroup" style="display: none;">

    <label for="repeatInterval">
        Repeat every
    </label>

    <input
        type="number"
        id="repeatInterval"
        min="1"
        value="1"
        placeholder="Enter number of days">

    <small>Number of days between classes.</small>

</div>


<!-- ==================================================
     REPEAT UNTIL
================================================== -->

<div class="form-group" id="repeatUntilGroup" style="display: none;">

    <label for="repeatUntil">
        Repeat Until
    </label>

    <input
        type="date"
        id="repeatUntil">

</div>



        <!-- ==================================================
             START AND END TIME
             ================================================== -->

        <div class="time-row">


            <div class="form-group">

                <label for="startTime">
                    Start Time
                </label>

                <input
                    type="time"
                    id="startTime">

            </div>


            <div class="form-group">

                <label for="endTime">
                    End Time
                </label>

                <input
                    type="time"
                    id="endTime">

            </div>

        </div>



        <!-- ==================================================
             VENUE
             ================================================== -->

        <div class="form-group">

            <label for="venue">
                Venue
            </label>

            <input
                type="text"
                id="venue"
                placeholder="e.g. Digital Arts Building, Room 3">

        </div>



        <!-- ==================================================
             DESCRIPTION
             ================================================== -->

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="4"
                placeholder="Add any extra details..."></textarea>

        </div>



        <!-- ==================================================
             SAVE BUTTON
             ================================================== -->

        <button
            id="saveEvent"
            class="primary-btn"
            type="button">

            Save Event

        </button>


    </main>

<!-- EVENT SAVED TOAST -->
<div id="eventSavedToast" class="event-saved-toast">
    <div class="event-saved-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <span>Event saved successfully!</span>
</div>
</div>

</body>

</html>
