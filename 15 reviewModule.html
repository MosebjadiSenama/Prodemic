<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Module</title>

<link rel="stylesheet" href="css/module.css">
 <link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/reviewModule.css">
<script type="module" src="js/reviewModule.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>

<body>

<div class="app-container">

<!--==================================================
                HEADER
===================================================-->

<button
type="button"
class="back-btn"
id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</button>


<section class="page-heading">

<h1>

Review Module

</h1>

<p>

Please review the information extracted by Prodemic AI.

</p>

</section>


<!--==================================================
                MODULE
===================================================-->

<div class="review-card">

<h3>

Module Name

</h3>

<p id="moduleName">

-

</p>

</div>



<div class="review-card">

<h3>

Module Code

</h3>

<p id="moduleCode">

-

</p>

</div>



<div class="review-card">

<h3>

Lecturer

</h3>

<p id="lecturer">

-

</p>

</div>



<div class="review-card">

<h3>

Email

</h3>

<p id="email">

-

</p>

</div>



<div class="review-card">

<h3>

Consultation Hours

</h3>

<p id="consultation">

-

</p>

</div>



<div class="review-card">

<h3>

Module Summary

</h3>

<p id="summary">

-

</p>

</div>



<!--==================================================
            LECTURE TIMES
===================================================-->

<h2 class="section-title">

Lecture Schedule

</h2>

<div id="lectureList">

</div>



<!--==================================================
            ASSESSMENTS
===================================================-->

<h2 class="section-title">

Assessments

</h2>

<div id="assessmentList">

</div>



<!--==================================================
            BUTTON
===================================================-->

<div class="button-container">

<button
class="continue-btn"
id="saveModule">

Save Module

</button>

</div>

</div>

</body>
</html>
